<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Territory Run</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/app.css?v=3" />
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h2>Territory Run</h2>
      <p>GPS territory runs in your browser. Continue as guest to start — Google login comes in Phase 1.2.</p>
      <button id="btnGuestLogin" class="btn btn-primary" style="width:100%">Continue as Guest</button>
      <p class="status-bar" id="loginStatus">Set API_BASE_URL in js/config.js</p>
    </div>
  </div>

  <div id="app" class="hidden" style="display:none">
    <header class="topbar">
      <div>
        <h1>Territory Run</h1>
        <div class="stats" id="headerStats">Guest · Cells: 0 · Score: 0</div>
      </div>
      <div style="display:flex;gap:8px">
        <button id="btnRefreshTiles" class="btn btn-ghost">Refresh map</button>
        <button id="btnNewGuest" class="btn btn-ghost">New guest</button>
      </div>
    </header>
    <div id="map"></div>
    <div class="run-panel">
      <div class="run-card">
        <div class="run-metrics">
          <div class="metric"><div class="val" id="metricDistance">0.00</div><div class="lbl">km</div></div>
          <div class="metric"><div class="val" id="metricCells">0</div><div class="lbl">cells</div></div>
          <div class="metric"><div class="val" id="metricPace">—</div><div class="lbl">pace</div></div>
        </div>
        <div class="run-actions">
          <button id="btnStart" class="btn btn-primary">Start run</button>
          <button id="btnPause" class="btn btn-ghost hidden">Pause</button>
          <button id="btnFinish" class="btn btn-danger hidden">Finish & claim</button>
        </div>
        <p class="status-bar" id="runStatus">Ready — allow GPS when prompted.</p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/h3-js@4.1.0/dist/browser/h3-js.min.js"></script>
  <script src="js/config.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
