<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OTA Test</title>
  <style>
    body { font-family: system-ui; background: #0f1419; color: #fff; padding: 24px; max-width: 480px; margin: 0 auto; }
  </style>
</head>
<body>
  <h1>OTA WebView test</h1>
  <p id="bridge">Checking native bridge…</p>
  <p id="api">API: —</p>
  <p id="token">Token: —</p>
  <p><a href="pages/profile.html">Open full profile page →</a></p>
  <script>
    const bridge = window.TerritoryBridge;
    document.getElementById('bridge').textContent = bridge
      ? 'Bridge OK — running inside Territory Run app'
      : 'No bridge — open this URL from the app WebView, not Chrome';
    if (bridge) {
      document.getElementById('api').textContent = 'API: ' + (bridge.getApiBaseUrl() || 'missing');
      const t = bridge.getAccessToken() || '';
      document.getElementById('token').textContent = 'Token: ' + (t ? t.slice(0, 20) + '…' : 'empty (sign in first)');
    }
  </script>
</body>
</html>
